[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botvscode2"
version = "2.0.0"
description = "Assistente para preparação automática do ambiente de desenvolvimento — Interface Gráfica."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Jorge Andrade" }
]
dependencies = [
    "flet>=0.85.3,<0.86"
]

[project.urls]
Repository = "https://github.com/jlsandradebelpa/botvscode2"
